<ion-header translucent>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/home']" aria-label="Volver a inicio" class="boton-volver-toolbar">
        <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
        Volver
      </ion-button>
    </ion-buttons>

    <ion-title>Foro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Botón justo debajo del toolbar -->
  <div class="ion-text-center ion-margin-bottom">
    <ion-button (click)="abrirModalCrearPublicacion()">
      <ion-icon name="add-circle-outline" slot="start"></ion-icon>
      Crear publicación
    </ion-button>
  </div>

  <div *ngIf="publicaciones().length === 0" class="ion-text-center ion-padding">
    <p>No hay publicaciones aún. ¡Sé el primero en crear una!</p>
  </div>

  <ion-list *ngIf="publicaciones().length > 0">
    <ion-item *ngFor="let publicacion of publicaciones()" [routerLink]="['/foro', publicacion.id]">
      <ion-label>
        <h2>{{ publicacion.titulo }}</h2>
        <p>Por: {{ publicacion.usuarioNombre }} - {{ publicacion.fechaCreacion | date:'short' }}</p>
        <p>{{ publicacion.contenido.substring(0, 100) }}...</p>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button *ngIf="usuarioActual?.uid === publicacion.usuarioId" (click)="eliminarPublicacion(publicacion.id!)" color="danger">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
</ion-content>
