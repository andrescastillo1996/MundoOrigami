<ion-header>
  <ion-toolbar>
    <ion-title>Crear Nueva Publicación</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input label="Título" labelPlacement="floating" [(ngModel)]="titulo" required></ion-input>
  </ion-item>
  <ion-item>
    <ion-textarea label="Contenido" labelPlacement="floating" [(ngModel)]="contenido" rows="5" required></ion-textarea>
  </ion-item>

  <ion-button expand="block" class="ion-margin-top" (click)="crearPublicacion()">
    Publicar
  </ion-button>
</ion-content>
