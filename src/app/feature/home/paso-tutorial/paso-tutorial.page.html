<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home/origami" />
    </ion-buttons>
    <ion-title>Paso a Paso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="pasos().length > 0; else sinPasos">
  <ng-container *ngIf="pasoActual() as paso">
    <ion-card class="paso-card">
      <img
        [src]="paso.imagen"
        alt="Imagen del paso {{ paso.orden }}"
        class="imagen-paso" />

      <ion-card-header>
        <ion-card-title class="titulo-paso"
          >Paso {{ paso.orden }}</ion-card-title
        >
      </ion-card-header>

      <ion-card-content class="descripcion-paso">
        {{ paso.descripcion }}
      </ion-card-content>
    </ion-card>

    <div class="navegacion">
      <ion-button
        fill="outline"
        color="primary"
        (click)="pasoAnterior()"
        [disabled]="pasoActualIndex() === 0">
        ← Anterior
      </ion-button>

      <ion-button color="success" (click)="siguientePaso()">
        {{ pasoActualIndex() === pasos().length - 1 ? 'Finalizar' : 'Siguiente
        →' }}
      </ion-button>
    </div>
  </ng-container>
</ion-content>

<ng-template #sinPasos>
  <ion-content>
    <div class="mensaje-vacio">
      No hay pasos disponibles para este tutorial.
    </div>
  </ion-content>
</ng-template>
